<div style="position: relative;">

    <!-- Subtle, rounded, gray icon button anchored to the top right -->
    <button *ngIf="copy"
            pButton pRipple
            class="p-button-rounded p-button-text p-button-secondary clipboard-btn"
            icon="far fa-clipboard"
            pTooltip="Copy code"
            tooltipPosition="left"
            style="position: absolute; top: 0; right: 0; width: 2.2rem; height: 2.2rem; z-index: 10; background-color: rgba(248, 249, 250, 0.9);"
            (click)="toClipboard()">
    </button>

    <code highlight-js [lang]="lang">{{code}}</code>

</div>
