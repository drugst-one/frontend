<div class="container">

    <div class="col-lg-12 mt-4 text-center">
        <h1 class="display-5 mb-2">How to cite</h1>
        <p class="mb-4 text-muted">
            <i>If you use Drugst.One functionalities in your work, please consider citing it as follows!</i>
        </p>
    </div>

    <!-- Drugst.One Core Section -->
    <p-card class="dt-card card mb-4">

        <!-- Custom Header inside the card body -->
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3 pb-2 border-bottom">
            <h4 class="mb-0 fw-bold" style="color: var(--p-card-color);">Drugst.One Core Features</h4>
            <span class="fs-6 fw-normal mt-2 mt-md-0">
                <span class="text-muted me-2">DOI URL:</span>
                <a href="https://doi.org/10.1093/nar/gkae388" target="_blank" class="link-primary text-decoration-none fw-bold">
                    <i class="pi pi-external-link" style="font-size: 0.85rem"></i> https://doi.org/10.1093/nar/gkae388
                </a>
            </span>
        </div>

        <!-- Side-by-Side Code Blocks -->
        <div class="row">
            <!-- Plain Text Column -->
            <div class="col-lg-5 mb-3 mb-lg-0">
                <label for="plain_core" class="form-label mb-1 fw-bold">Plain</label>
                <pre class="mb-0" style="height: 170px; overflow-y: auto;"><app-code lang="plaintext" [code]="plain"></app-code></pre>
            </div>
            <!-- BibTeX Column -->
            <div class="col-lg-7">
                <label for="bibtex_core" class="form-label mb-1 fw-bold">BibTeX</label>
                <pre class="mb-0" style="height: 170px; overflow-y: auto;"><app-code lang="plaintext" [code]="bibtex"></app-code></pre>
            </div>
        </div>

    </p-card>

    <!-- Drugst.One DREAM Section -->
    <p-card class="dt-card card mb-4">

        <!-- Custom Header inside the card body -->
        <div class="d-flex justify-content-between align-items-center flex-wrap mb-3 pb-2 border-bottom">
            <h4 class="mb-0 fw-bold" style="color: var(--p-card-color);">Drugst.One DREAM Expansion</h4>
            <span class="fs-6 fw-normal mt-2 mt-md-0">
                <span class="text-muted me-2">DOI URL:</span>
                <a href="https://doi.org/10.1111/bph.70495" target="_blank" class="link-primary text-decoration-none fw-bold">
                    <i class="pi pi-external-link" style="font-size: 0.85rem"></i> https://doi.org/10.1111/bph.70495
                </a>
            </span>
        </div>

        <!-- Side-by-Side Code Blocks -->
        <div class="row">
            <!-- Plain Text Column -->
            <div class="col-lg-5 mb-3 mb-lg-0">
                <label for="plain_dream" class="form-label mb-1 fw-bold">Plain</label>
                <pre class="mb-0" style="height: 170px; overflow-y: auto;"><app-code lang="plaintext" [code]="dream_plain"></app-code></pre>
            </div>
            <!-- BibTeX Column -->
            <div class="col-lg-7">
                <label for="bibtex_dream" class="form-label mb-1 fw-bold">BibTeX</label>
                <pre class="mb-0" style="height: 170px; overflow-y: auto;"><app-code lang="plaintext" [code]="dream_bibtex"></app-code></pre>
            </div>
        </div>

    </p-card>

</div>
